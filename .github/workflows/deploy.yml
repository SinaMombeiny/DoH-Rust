name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install worker-build
        run: cargo install -q worker-build
      - name: Build Worker
        run: worker-build --release
        env:
          CARGO_ENCODED_RUSTFLAGS: "-Ctarget-feature=+reference-types"
      - name: Check wasm features
        run: |
          cargo install wasm-tools --locked || true
          wasm-tools validate --features reference-types target/wasm32-unknown-unknown/release/doh_proxy.wasm && echo "✅ reference-types present" || echo "❌ reference-types missing"
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
